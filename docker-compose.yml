services:
  novec-app-store:
    build: .
    container_name: novec-app-store
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
